<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Birthday Wish</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-lg">
        <h2 class="text-3xl font-bold mb-6 text-center text-pink-500">Create a Surprise</h2>
        
        <form id="customerForm" class="space-y-4">
            <input type="text" id="receiverName" placeholder="Birthday Person's Name" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-pink-500">
            <input type="text" id="senderName" placeholder="Your Name" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-pink-500">
            <input type="date" id="birthdayDate" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-gray-300">
            <textarea id="letterText" placeholder="Personal Letter/Message" rows="4" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-pink-500"></textarea>
            
            <label class="block text-sm text-gray-400">Upload Photo from Gallery (Max 1 for now):</label>
            <input type="file" id="imageUpload" accept="image/*" class="w-full p-2 bg-gray-700 rounded text-sm text-gray-300">
            
            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 p-3 rounded font-bold transition duration-300">Generate My Link</button>
        </form>

        <div id="resultContainer" class="mt-6 hidden bg-gray-700 p-4 rounded text-center">
            <p class="mb-2 text-green-400 font-semibold">Page Created!</p>
            <input type="text" id="generatedLink" readonly class="w-full p-2 bg-gray-900 rounded text-sm text-gray-300 mb-3">
            <button onclick="copyLink()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-bold w-full">Copy Link</button>
        </div>
    </div>

    <script>
        let base64Image = "";
        
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => { base64Image = reader.result; };
            if(file) reader.readAsDataURL(file);
        });

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                receiverName: document.getElementById('receiverName').value,
                senderName: document.getElementById('senderName').value,
                birthdayDate: document.getElementById('birthdayDate').value,
                letterText: document.getElementById('letterText').value,
                images: base64Image ? [base64Image] : []
            };

            const response = await fetch('/api/wish/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if (result.success) {
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('generatedLink').value = window.location.origin + result.link;
            } else {
                alert('Error generating link!');
            }
        });

        function copyLink() {
            const linkInput = document.getElementById('generatedLink');
            linkInput.select();
            document.execCommand('copy');
            alert("Link Copied!");
        }
    </script>
</body>
</html>
