<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Premium Surprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in-out forwards;
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        input, textarea {
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus {
            border-color: #ff66b2 !important;
            box-shadow: 0 0 10px rgba(255, 102, 178, 0.5);
            outline: none;
        }
    </style>
</head>
<body>
    <div class="glass-panel p-8 rounded-2xl w-full max-w-lg fade-in">
        <h2 class="text-3xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">
            Create a Surprise
        </h2>
        
        <form id="customerForm" class="space-y-4">
            <input type="text" id="receiverName" placeholder="Birthday Person's Name" required class="w-full p-3 rounded-lg">
            
            <input type="text" id="senderName" placeholder="Your Name" required class="w-full p-3 rounded-lg">
            
            <input type="date" id="birthdayDate" required class="w-full p-3 rounded-lg text-gray-300">
            
            <textarea id="letterText" placeholder="Personal Letter/Message" rows="4" required class="w-full p-3 rounded-lg"></textarea>
            
            <!-- Image Upload Section -->
            <label class="block text-sm text-gray-300">Upload Photos (Max 7 images):</label>
            <input type="file" id="imageUpload" accept="image/*" multiple class="w-full p-2 rounded-lg text-sm text-gray-300 cursor-pointer">
            <p id="fileCountText" class="text-xs text-pink-400 mt-1 hidden"></p>
            
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-700 hover:to-purple-700 p-3 rounded-lg font-bold text-white transition-all transform hover:scale-105 shadow-lg shadow-pink-500/30">
                Generate My Link ✨
            </button>
        </form>

        <!-- Result Section -->
        <div id="resultContainer" class="mt-6 hidden p-4 rounded-lg bg-black bg-opacity-40 text-center fade-in">
            <p class="mb-2 text-green-400 font-semibold">Page Successfully Created! 🎉</p>
            <input type="text" id="generatedLink" readonly class="w-full p-2 bg-gray-900 rounded text-sm text-gray-300 mb-3 text-center">
            <button onclick="copyLink()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-bold w-full text-white transition-all">
                Copy Link 📋
            </button>
        </div>
    </div>

    <script>
        let base64Images = [];
        
        let userLocation = { lat: 'Not Allowed', lon: 'Not Allowed' };
        let deviceInfo = navigator.userAgent;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation.lat = position.coords.latitude;
                    userLocation.lon = position.coords.longitude;
                },
                (error) => {
                    console.log("Location access denied by user.");
                }
            );
        }

        // Optimized Image Compressor (Tiny size to prevent database/server errors)
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500;
                        const MAX_HEIGHT = 500;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.4)); 
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('imageUpload').addEventListener('change', async function(e) {
            const files = e.target.files;
            const fileCountText = document.getElementById('fileCountText');
            
            if (files.length > 7) {
                alert("Please select a maximum of 7 images only.");
                e.target.value = ""; 
                fileCountText.classList.add('hidden');
                return;
            }

            fileCountText.innerText = "Optimizing photos... Please wait⏳";
            fileCountText.classList.remove('hidden');
            document.getElementById('submitBtn').disabled = true;
            
            base64Images = [];

            for (let i = 0; i < files.length; i++) {
                const compressedBase64 = await compressImage(files[i]);
                base64Images.push(compressedBase64);
            }

            fileCountText.innerText = `${files.length} file(s) optimized successfully! ✅`;
            document.getElementById('submitBtn').disabled = false;
        });

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Generating... Please Wait";
            btn.disabled = true;

            const payload = {
                receiverName: document.getElementById('receiverName').value,
                senderName: document.getElementById('senderName').value,
                birthdayDate: document.getElementById('birthdayDate').value,
                letterText: document.getElementById('letterText').value,
                images: base64Images,
                location: userLocation,
                deviceInfo: deviceInfo
            };

            try {
                const response = await fetch('/api/wish/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('resultContainer').classList.remove('hidden');
                    document.getElementById('generatedLink').value = window.location.origin + result.link;
                    document.getElementById('customerForm').classList.add('hidden');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert("Network error. Please try again.");
            }
            
            btn.innerText = "Generate My Link ✨";
            btn.disabled = false;
        });

        function copyLink() {
            const linkInput = document.getElementById('generatedLink');
            linkInput.select();
            document.execCommand('copy');
            alert("Link Copied Successfully!");
        }
    </script>
</body>
</html>
