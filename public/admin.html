<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">

    <div id="loginScreen" class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl mt-20 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
        <input type="text" id="adminUser" placeholder="Username" class="w-full mb-4 p-3 bg-gray-700 rounded outline-none">
        <input type="password" id="adminPass" placeholder="Password" class="w-full mb-6 p-3 bg-gray-700 rounded outline-none">
        <button onclick="adminLogin()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold">Login</button>
    </div>

    <div id="dashboardScreen" class="hidden max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-pink-500">All Customer Submissions</h1>
        <div id="dataContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        async function adminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                loadDashboardData();
            } else {
                alert(data.message);
            }
        }

        async function loadDashboardData() {
            const res = await fetch('/api/admin/all-wishes');
            const result = await res.json();
            
            const container = document.getElementById('dataContainer');
            container.innerHTML = "";

            result.data.forEach(wish => {
                const imgTag = wish.images.length > 0 ? `<img src="${wish.images[0]}" class="w-full h-40 object-cover rounded mt-3">` : `<p class="text-sm text-gray-500 mt-2">No Image Uploaded</p>`;
                
                container.innerHTML += `
                    <div class="bg-gray-800 p-5 rounded-lg border border-gray-700">
                        <p><strong>To:</strong> ${wish.receiverName}</p>
                        <p><strong>From:</strong> ${wish.senderName}</p>
                        <p><strong>Date:</strong> ${wish.birthdayDate}</p>
                        <p class="text-sm text-gray-400 mt-2 italic">"${wish.letterText}"</p>
                        <a href="/w/${wish.wishId}" target="_blank" class="text-blue-400 text-sm hover:underline block mt-2">Open Link</a>
                        ${imgTag}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
