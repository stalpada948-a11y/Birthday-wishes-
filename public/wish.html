<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d0015, #2b003a, #0d0015);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .screen {
            min-height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .active { display: flex; }

        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.2);
        }

        .glow-text {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        .fade-in { animation: fadeIn 1.5s ease-in-out forwards; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 25px;
            width: 100%;
        }

        .photo-gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 102, 178, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 102, 178, 0.6);
        }

        button {
            transition: all 0.3s ease;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="loadingScreen" class="screen active">
        <h2 class="text-2xl font-bold text-pink-400 animate-pulse">Loading your surprise... ✨</h2>
    </div>

    <div id="introScreen" class="screen">
        <h1 class="text-4xl font-bold mb-4">Hey... 👀</h1>
        <p class="text-lg text-gray-300 mb-8">Someone has a little surprise for you...</p>
        <button id="openSurpriseBtn" class="bg-gradient-to-r from-pink-600 to-purple-600 px-8 py-3 rounded-full font-bold text-lg shadow-[0_0_15px_rgba(255,102,178,0.5)] hover:shadow-[0_0_25px_rgba(255,102,178,0.8)]">
            Open My Surprise 🎁
        </button>
    </div>

    <div id="mainWishScreen" class="screen p-4 py-10">
        <div class="glass-box p-6 md:p-10 rounded-2xl w-full max-w-2xl fade-in flex flex-col justify-between">
            <div>
                <h3 id="displayReceiver" class="text-xl md:text-2xl text-pink-300 mb-2"></h3>
                <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 glow-text mb-6">
                    HAPPY BIRTHDAY!
                </h1>
                
                <div class="bg-black bg-opacity-40 p-5 rounded-xl border border-gray-700 text-left mb-6">
                    <h4 class="text-pink-400 text-sm mb-3 font-semibold tracking-wider">💌 MESSAGE FOR YOU</h4>
                    <p id="displayLetter" class="text-gray-200 leading-relaxed text-sm md:text-base whitespace-pre-wrap"></p>
                </div>

                <div id="galleryContainer" class="hidden">
                    <h4 class="text-pink-400 text-sm mt-8 mb-2 font-semibold tracking-wider text-left">📸 LITTLE MEMORIES</h4>
                    <div id="photoGallery" class="photo-gallery">
                        </div>
                </div>

                <div class="mt-8 border-t border-gray-700 pt-5 text-right">
                    <p id="displaySender" class="text-pink-400 italic text-lg font-semibold"></p>
                </div>
            </div>

            <div class="mt-12 pt-6 border-t border-gray-800 text-center">
                <p class="text-gray-300 font-semibold mb-4 tracking-wide text-lg">Thanks for watching ✨</p>
                
                <a href="https://www.instagram.com/xo23.onlyone?igsh=bDc2OWp3Z2Y4anBp" target="_blank" class="inline-flex items-center gap-2 bg-gradient-to-r from-purple-600 via-pink-600 to-yellow-500 px-5 py-2.5 rounded-full text-white font-medium hover:scale-105 transition shadow-lg shadow-pink-500/20 mb-4">
                    <i class="fa-brands fa-instagram text-xl"></i>
                    <span>Follow more on Instagram: <strong>@xo23.onlyone</strong></span>
                </a>

                <p class="text-xs text-gray-500 mt-2">Made by xo23.onlyone</p>
            </div>
        </div>
    </div>

    <script>
        const loadWishData = async () => {
            const pathParts = window.location.pathname.split('/');
            const wishId = pathParts[pathParts.length - 1];

            if (!wishId || wishId === 'w') return;

            try {
                const response = await fetch(`/api/wish/data/${wishId}`);
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    
                    // Set Texts
                    document.getElementById('displayReceiver').innerText = `Specially for you, ${data.receiverName}`;
                    document.getElementById('displayLetter').innerText = data.letterText;
                    document.getElementById('displaySender').innerText = `- Made with ❤️ by ${data.senderName}`;

                    // Set Images if available
                    if (data.images && data.images.length > 0) {
                        const galleryContainer = document.getElementById('galleryContainer');
                        const photoGallery = document.getElementById('photoGallery');
                        
                        galleryContainer.classList.remove('hidden'); // Show gallery section
                        
                        data.images.forEach(imgUrl => {
                            const imgElement = document.createElement('img');
                            imgElement.src = imgUrl;
                            photoGallery.appendChild(imgElement);
                        });
                    }

                    // Switch from Loading to Intro Screen
                    document.getElementById('loadingScreen').classList.remove('active');
                    document.getElementById('introScreen').classList.add('active');
                } else {
                    document.getElementById('loadingScreen').innerHTML = "<h2 class='text-red-400 text-2xl'>Oops! This surprise couldn't be found. 💔</h2>";
                }
            } catch (error) {
                document.getElementById('loadingScreen').innerHTML = "<h2 class='text-red-400 text-2xl'>Server Error. Please try again later.</h2>";
            }
        };

        // Open Surprise Button Logic
        document.getElementById('openSurpriseBtn').addEventListener('click', () => {
            document.getElementById('introScreen').classList.remove('active');
            document.getElementById('mainWishScreen').classList.add('active');
            window.scrollTo(0, 0); // Scroll to top for the main screen
        });

        // Auto-run when the page loads
        if (window.location.pathname.startsWith('/w/')) {
            loadWishData();
        }
    </script>
</body>
</html>
