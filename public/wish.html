<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Surprise! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1b0f2e 0%, #090410 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }
        .screen {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            pointer-events: auto;
            position: relative;
        }
        h1, h2 {
            font-weight: 600;
            margin-bottom: 15px;
        }
        .script-font {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            color: #ff758c;
        }
        .btn-custom {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.5);
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-custom:active {
            transform: scale(0.95);
        }
        /* Gift Box Styles */
        .gift-container {
            cursor: pointer;
            animation: bounce 2s infinite ease-in-out;
            margin: 30px 0;
        }
        .gift-box-icon {
            font-size: 90px;
            filter: drop-shadow(0 10px 20px rgba(255, 117, 140, 0.4));
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }
        /* Letter Card */
        .letter-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: left;
            margin: 20px 0;
        }
        .letter-card p {
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 1rem;
        }
        /* Photo Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 450px;
            width: 100%;
            margin-top: 20px;
        }
        .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.03);
        }
        .gallery-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
        }
        .gallery-item span {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #ff9a9e;
            font-weight: 500;
        }
        /* Floating Confetti / Hearts */
        .floating-element {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="screen-1" class="screen active">
        <h2 class="script-font" style="font-size: 4rem; color: #ff9a9e;">Hello there... ✨</h2>
        <p style="color: #b19cd9; font-size: 1.1rem; margin: 15px 0;">Someone special has created a magical surprise just for you.</p>
        <button class="btn-custom" onclick="startExperience()">OPEN SURPRISE 🎁</button>
    </div>

    <div id="screen-2" class="screen">
        <h2 id="recipient-greeting" style="font-size: 1.8rem; color: #fff;">A Special Gift For You!</h2>
        <div class="gift-container" onclick="openGift()">
            <div class="gift-box-icon">🎁</div>
        </div>
        <p style="color: #aaa; font-size: 0.95rem;">Tap the gift box to open it</p>
    </div>

    <div id="screen-3" class="screen">
        <h1 class="script-font" style="color: #ff416c; font-size: 4.5rem;">Happy Birthday! 🎉</h1>
        <h2 id="wish-subtitle" style="font-size: 1.5rem; letter-spacing: 1px; margin-bottom: 10px;"></h2>
        <div class="letter-card">
            <p id="wish-message-text"></p>
        </div>
        <button class="btn-custom" onclick="nextScreen(4)">View Memories ➔</button>
    </div>

    <div id="screen-4" class="screen">
        <h2 class="script-font" style="font-size: 3rem; color: #ff9a9e;">Sweet Memories ✨</h2>
        <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 10px;">Moments that will stay in heart forever.</p>
        <div class="gallery-grid" id="dynamic-photo-grid">
            </div>
        <button class="btn-custom" onclick="nextScreen(5)" style="margin-top: 20px;">Final Note ➔</button>
    </div>

    <div id="screen-5" class="screen">
        <div style="font-size: 60px; margin-bottom: 10px;">💖</div>
        <h2 class="script-font" style="font-size: 3.8rem; color: #ff758c;">Stay Happy Always</h2>
        <p id="sender-signature" style="font-size: 1.2rem; color: #ff9a9e; font-weight: 600; margin-top: 15px;"></p>
        <button class="btn-custom" onclick="location.reload()" style="margin-top: 30px;">WATCH AGAIN 🔄</button>
    </div>

    <script>
        // Extract Wish ID from URL path
        const pathSegments = window.location.pathname.split('/');
        const uniqueWishId = pathSegments[pathSegments.length - 1];

        let wishDataObject = null;

        async function fetchWishDetails() {
            try {
                const res = await fetch(`/api/wish/${uniqueWishId}`);
                const data = await res.json();
                if(data) {
                    wishDataObject = data;
                    document.getElementById('recipient-greeting').innerText = `A Special Gift For You, ${data.recipientName}! 🎁`;
                    document.getElementById('wish-subtitle').innerText = data.recipientName.toUpperCase();
                    document.getElementById('wish-message-text').innerText = data.message;
                    document.getElementById('sender-signature').innerText = `With endless love, ${data.senderName}`;

                    // Populate Photos
                    const grid = document.getElementById('dynamic-photo-grid');
                    grid.innerHTML = '';
                    if(data.photos && data.photos.length > 0) {
                        data.photos.forEach((photoUrl, index) => {
                            grid.innerHTML += `
                                <div class="gallery-item">
                                    <img src="${photoUrl}" alt="Memory ${index + 1}">
                                    <span>Memory #${index + 1} ✨</span>
                                </div>
                            `;
                        });
                    }
                }
            } catch (err) {
                console.error('Failed to load wish data:', err);
            }
        }

        fetchWishDetails();

        function nextScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenNum}`).classList.add('active');
        }

        function startExperience() {
            nextScreen(2);
            createFloatingHearts();
        }

        function openGift() {
            // Unbox effect animation container
            nextScreen(3);
        }

        function createFloatingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-element');
                heart.innerHTML = ['❤️', '✨', '💖', '🎉'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>
